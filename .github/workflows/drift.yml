name: drift
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build.mjs
      - id: diff
        run: node tools/drift.mjs | tee drift.txt
        continue-on-error: true
      - if: steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "deploy-drift $(date -u +%F)" --label deploy-drift --body "$(cat drift.txt)" || gh issue create --title "deploy-drift $(date -u +%F)" --body "$(cat drift.txt)"
