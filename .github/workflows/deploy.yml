name: Deploy myshop
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myshop-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      # Publish the validated build from this exact default-branch commit.
      - name: Deploy master to production
        run: npx --yes wrangler@4.151.2 pages deploy dist --project-name="${CF_PAGES_PROJECT:-myshop}" --branch=master --commit-hash="${{ github.sha }}" --commit-dirty=false
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
